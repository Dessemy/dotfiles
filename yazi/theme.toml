[mgr]
cwd = { fg = "#89b4fa" }

hovered         = { fg = "#1e1e2e", bg = "#89b4fa" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#f9e2af", italic = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#89b4fa", bg = "#89b4fa" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

tab_active   = { fg = "#1e1e2e", bg = "#cba6f7" }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
tab_width_max = 20

tab_sep_inner = { open = "[", close = "]" }
tab_sep_outer = { open = "", close = "" }

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#f9e2af" }

border_symbol = "│"
border_style  = { fg = "#585b70" }

[status]
overall = { fg = "#cdd6f4", bg = "#181825" }

sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

perm_type  = { fg = "#89dceb" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }
perm_sep   = { fg = "#585b70" }

[input]
border   = { fg = "#585b70" }
title    = { fg = "#cdd6f4" }
value    = { fg = "#cdd6f4" }
selected = { reversed = true }

[select]
border   = { fg = "#585b70" }
active   = { fg = "#f9e2af" }
inactive = { fg = "#a6adc8" }

[tasks]
border  = { fg = "#585b70" }
title   = { fg = "#cdd6f4" }
hovered = { underline = true }

[which]
mask            = { bg = "#181825" }
cand            = { fg = "#89dceb" }
rest            = { fg = "#6c7086" }
desc            = { fg = "#f9e2af" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#a6e3a1" }
run     = { fg = "#89dceb" }
exec    = { fg = "#cdd6f4" }
desc    = { fg = "#a6adc8" }
hovered = { bg = "#89b4fa", fg = "#1e1e2e", bold = true }
footer  = { fg = "#a6adc8" }

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[pick]
border   = { fg = "#585b70" }
active   = { fg = "#f9e2af" }
inactive = { fg = "#a6adc8" }

[confirm]
border  = { fg = "#585b70" }
title   = { fg = "#cdd6f4" }
content = { fg = "#cdd6f4" }
list    = { fg = "#a6adc8" }
btn_yes = { reversed = true }
btn_no  = { fg = "#a6adc8" }

[indicator]
padding = { open = "█", close = "█" }

[filetype]
rules = [
  { url = "*/", fg = "#89b4fa", bold = true },
  { mime = "text/*", fg = "#cdd6f4" },
  { mime = "image/*", fg = "#f9e2af" },
  { mime = "video/*", fg = "#f5c2e7" },
  { mime = "audio/*", fg = "#94e2d5" },
  { mime = "application/zip", fg = "#f38ba8" },
  { mime = "application/x-tar", fg = "#f38ba8" },
  { mime = "application/x-bzip2", fg = "#f38ba8" },
  { mime = "application/x-7z-compressed", fg = "#f38ba8" },
  { mime = "application/x-rar", fg = "#f38ba8" },
]
